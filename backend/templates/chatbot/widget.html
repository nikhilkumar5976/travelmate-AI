<style>
  #chatbot-toggle {
    position: fixed; right: 24px; bottom: 24px; z-index: 1000;
    padding: 12px 22px; border: none; border-radius: 999px;
    background: #fb923c; color: #1b1005; font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(251, 146, 60, 0.45);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #chatbot-toggle:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(251, 146, 60, 0.6);
  }
  #chatbot-panel {
    position: fixed; right: 24px; bottom: 84px; z-index: 1000;
    width: 340px; height: 440px; display: flex; flex-direction: column;
    background: #0c1735; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 18px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55); overflow: hidden;
    backdrop-filter: blur(16px);
  }
  #chatbot-panel[hidden] { display: none; }
  #chatbot-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: linear-gradient(135deg, #1e3a8a, #c2410c);
    color: #fff; font-weight: 800; font-size: 15px; letter-spacing: 0.3px;
  }
  #chatbot-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; }
  #chatbot-messages { flex: 1; overflow-y: auto; padding: 14px; background: #070e20; }
  .chatbot-msg {
    margin: 8px 0; padding: 10px 12px; border-radius: 12px; max-width: 85%;
    white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.5;
  }
  .chatbot-user { background: #1e3a8a; color: #e8f0ff; margin-left: auto; border-bottom-right-radius: 2px; }
  .chatbot-assistant {
    background: rgba(255, 255, 255, 0.08); color: #e8f0ff; margin-right: auto;
    border: 1px solid rgba(255, 255, 255, 0.1); border-bottom-left-radius: 2px;
  }
  #chatbot-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid rgba(255, 255, 255, 0.12); background: #0b1530; }
  #chatbot-input {
    flex: 1; padding: 10px 12px; border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: #e8f0ff; font-size: 14px; outline: none;
  }
  #chatbot-input:focus { border-color: #38bdf8; }
  #chatbot-form button {
    padding: 10px 16px; border: none; border-radius: 8px;
    background: #fb923c; color: #1b1005; font-weight: 700; cursor: pointer; font-size: 14px;
    transition: opacity 0.2s;
  }
  #chatbot-form button:disabled { opacity: 0.5; cursor: default; }
</style>

<div id="chatbot" data-url="{% url 'chatbot_reply' %}" data-csrf="{{ csrf_token }}">
  <button id="chatbot-toggle" type="button">Chat</button>
  <div id="chatbot-panel" hidden>
    <div id="chatbot-header">
      <span>Travel assistant</span>
      <button id="chatbot-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="chatbot-messages"></div>
    <form id="chatbot-form">
      <input id="chatbot-input" type="text" maxlength="500"
             placeholder="Ask about a destination..." autocomplete="off" required>
      <button id="chatbot-send" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
  (function () {
    var root = document.getElementById('chatbot');
    var toggle = document.getElementById('chatbot-toggle');
    var panel = document.getElementById('chatbot-panel');
    var closeButton = document.getElementById('chatbot-close');
    var messagesBox = document.getElementById('chatbot-messages');
    var form = document.getElementById('chatbot-form');
    var input = document.getElementById('chatbot-input');
    var sendButton = document.getElementById('chatbot-send');
    var history = [];
    var isSending = false;

    function addMessage(role, text) {
      var div = document.createElement('div');
      div.className = 'chatbot-msg chatbot-' + role;
      div.textContent = text;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return div;
    }

    toggle.addEventListener('click', function () {
      panel.hidden = !panel.hidden;
      if (!panel.hidden) {
        if (messagesBox.children.length === 0) {
          addMessage('assistant', 'Hi! Ask me anything about a travel destination.');
        }
        input.focus();
      }
    });

    closeButton.addEventListener('click', function () {
      panel.hidden = true;
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (isSending) { return; }
      var text = input.value.trim();
      if (!text) { return; }

      isSending = true;
      addMessage('user', text);
      input.value = '';
      var thinking = addMessage('assistant', 'Thinking...');
      sendButton.disabled = true;

      fetch(root.dataset.url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': root.dataset.csrf
        },
        body: JSON.stringify({ message: text, history: history })
      })
        .then(function (response) {
          return response.json().then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (result.ok) {
            thinking.textContent = result.data.reply;
            history.push({ role: 'user', text: text });
            history.push({ role: 'assistant', text: result.data.reply });
            history = history.slice(-10);
          } else {
            thinking.textContent = result.data.error || 'Something went wrong.';
          }
        })
        .catch(function () {
          thinking.textContent = 'Could not reach the assistant. Please try again.';
        })
        .then(function () {
          isSending = false;
          sendButton.disabled = false;
          messagesBox.scrollTop = messagesBox.scrollHeight;
          input.focus();
        });
    });
  })();
</script>
