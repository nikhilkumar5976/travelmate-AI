{% load static %}
<link rel="stylesheet" href="{% static 'css/chatbot.css' %}">

<div id="chatbot" data-url="{% url 'chatbot_reply' %}" data-csrf="{{ csrf_token }}">
  <button id="chatbot-toggle" type="button">
    <span class="toggle-mark"></span>
    <span>AI Assistant</span>
  </button>
  <div id="chatbot-panel" hidden>
    <div id="chatbot-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80;"></span>
        <span>Destination Assistant</span>
      </div>
      <button id="chatbot-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="chatbot-messages"></div>
    <form id="chatbot-form">
      <input id="chatbot-input" type="text" maxlength="500"
             placeholder="Ask about a destination..." autocomplete="off" required>
      <button id="chatbot-send" type="submit">Send</button>
    </form>
  </div>
</div>

<script src="{% static 'js/chatbot.js' %}"></script>
