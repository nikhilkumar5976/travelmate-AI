<style>
  #chatbot-toggle {
    position: fixed; right: 24px; bottom: 24px; z-index: 1000;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 999px;
    background: #fff; color: #05070f; font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.25);
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: var(--body);
  }
  #chatbot-toggle:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5), 0 0 26px rgba(56, 189, 248, 0.4);
  }
  #chatbot-toggle .toggle-mark {
    width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg, #38bdf8, #a78bfa 60%, #fb923c);
  }
  #chatbot-panel {
    position: fixed; right: 24px; bottom: 84px; z-index: 1000;
    width: 360px; height: 460px; display: flex; flex-direction: column;
    background: rgba(10, 16, 32, 0.95);
    border: 1px solid var(--line-strong);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    font-family: var(--body);
  }
  #chatbot-panel[hidden] { display: none; }
  #chatbot-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px;
    background: rgba(5, 7, 15, 0.7);
    border-bottom: 1px solid var(--line);
    color: var(--text); font-weight: 600; font-size: 14px;
    font-family: var(--display);
  }
  #chatbot-close {
    background: none; border: none; color: var(--muted);
    font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px;
    transition: color 0.2s;
  }
  #chatbot-close:hover { color: #fff; }
  #chatbot-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    background: rgba(5, 7, 15, 0.4);
    display: flex; flex-direction: column; gap: 10px;
  }
  .chatbot-msg {
    padding: 12px 14px; border-radius: 14px; max-width: 85%;
    white-space: pre-wrap; word-wrap: break-word; font-size: 13px; line-height: 1.5;
  }
  .chatbot-user {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; margin-left: auto; border-bottom-right-radius: 3px;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
  }
  .chatbot-assistant {
    background: rgba(255, 255, 255, 0.05); color: var(--text);
    margin-right: auto; border: 1px solid var(--line); border-bottom-left-radius: 3px;
  }
  #chatbot-form {
    display: flex; gap: 8px; padding: 12px 14px;
    border-top: 1px solid var(--line);
    background: rgba(5, 7, 15, 0.8);
  }
  #chatbot-input {
    flex: 1; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: rgba(255, 255, 255, 0.05);
    color: var(--text); font-size: 13px; outline: none;
    font-family: var(--body);
  }
  #chatbot-input:focus { border-color: var(--sky); background: rgba(255, 255, 255, 0.08); }
  #chatbot-form button {
    padding: 10px 16px; border: none; border-radius: 10px;
    background: #fff; color: #05070f; font-weight: 600; cursor: pointer; font-size: 13px;
    font-family: var(--body);
    transition: opacity 0.2s, transform 0.2s;
  }
  #chatbot-form button:hover:not(:disabled) { transform: translateY(-1px); }
  #chatbot-form button:disabled { opacity: 0.5; cursor: default; }
</style>

<div id="chatbot" data-url="{% url 'chatbot_reply' %}" data-csrf="{{ csrf_token }}">
  <button id="chatbot-toggle" type="button">
    <span class="toggle-mark"></span>
    <span>AI Assistant</span>
  </button>
  <div id="chatbot-panel" hidden>
    <div id="chatbot-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80;"></span>
        <span>Destination Assistant</span>
      </div>
      <button id="chatbot-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="chatbot-messages"></div>
    <form id="chatbot-form">
      <input id="chatbot-input" type="text" maxlength="500"
             placeholder="Ask about a destination..." autocomplete="off" required>
      <button id="chatbot-send" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
  (function () {
    var root = document.getElementById('chatbot');
    var toggle = document.getElementById('chatbot-toggle');
    var panel = document.getElementById('chatbot-panel');
    var closeButton = document.getElementById('chatbot-close');
    var messagesBox = document.getElementById('chatbot-messages');
    var form = document.getElementById('chatbot-form');
    var input = document.getElementById('chatbot-input');
    var sendButton = document.getElementById('chatbot-send');
    var history = [];
    var isSending = false;

    function addMessage(role, text) {
      var div = document.createElement('div');
      div.className = 'chatbot-msg chatbot-' + role;
      div.textContent = text;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return div;
    }

    toggle.addEventListener('click', function () {
      panel.hidden = !panel.hidden;
      if (!panel.hidden) {
        if (messagesBox.children.length === 0) {
          addMessage('assistant', 'Hi! Ask me anything about a travel destination.');
        }
        input.focus();
      }
    });

    closeButton.addEventListener('click', function () {
      panel.hidden = true;
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (isSending) { return; }
      var text = input.value.trim();
      if (!text) { return; }

      isSending = true;
      addMessage('user', text);
      input.value = '';
      var thinking = addMessage('assistant', 'Thinking...');
      sendButton.disabled = true;

      fetch(root.dataset.url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': root.dataset.csrf
        },
        body: JSON.stringify({ message: text, history: history })
      })
        .then(function (response) {
          return response.json().then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (result.ok) {
            thinking.textContent = result.data.reply;
            history.push({ role: 'user', text: text });
            history.push({ role: 'assistant', text: result.data.reply });
            history = history.slice(-10);
          } else {
            thinking.textContent = result.data.error || 'Something went wrong.';
          }
        })
        .catch(function () {
          thinking.textContent = 'Could not reach the assistant. Please try again.';
        })
        .then(function () {
          isSending = false;
          sendButton.disabled = false;
          messagesBox.scrollTop = messagesBox.scrollHeight;
          input.focus();
        });
    });
  })();
</script>
