{% extends 'base.html' %}

{% block title %}Password changed - TravelMate AI{% endblock %}
{% block container_class %}container-narrow{% endblock %}

{% block content %}
<div class="card" style="margin-top: 24px; padding: 36px 32px; text-align: center;">
  <div style="display: flex; justify-content: center; margin-bottom: 20px;">
    <div style="width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: #34d399; background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.25);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    </div>
  </div>
  <h1 style="margin-bottom: 8px; font-size: 28px;">Password <span class="grad">changed!</span></h1>
  <p style="margin-bottom: 28px; font-size: 15px; color: var(--muted); line-height: 1.6;">
    Your password has been set. You may now log in with your new password.
  </p>

  <a href="{% url 'login' %}" class="btn" style="width: 100%; padding: 13px 24px; font-size: 15px;">
    Log in &rarr;
  </a>
</div>
{% endblock %}
