<!DOCTYPE html>
<html>
<head><title>Edit profile - TravelMate AI</title></head>
<body>
  <h1>Edit profile</h1>

  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}

  {% if profile.photo %}
    <img src="{{ profile.photo.url }}" alt="Your photo" width="120">
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save profile</button>
  </form>

  <p><a href="{% url 'home' %}">Back to home</a></p>
</body>
</html>
