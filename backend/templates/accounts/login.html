{% extends 'base.html' %}

{% block title %}Log in - TravelMate AI{% endblock %}
{% block container_class %}container-narrow{% endblock %}

{% block content %}
<div class="card" style="margin-top: 20px;">
  <h1 style="text-align: center; margin-bottom: 6px;">Welcome back</h1>
  <p style="text-align: center; margin-bottom: 24px;">Log in to plan your trips with friends.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Log in</button>
  </form>

  <p style="text-align: center; margin-top: 24px; margin-bottom: 0;">
    New here?
    <a href="{% url 'signup' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}" style="color: var(--sky); font-weight: 600;">
      Create an account
    </a>
  </p>
</div>
{% endblock %}
