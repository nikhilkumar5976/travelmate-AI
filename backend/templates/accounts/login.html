<!DOCTYPE html>
<html>
<head><title>Log in - TravelMate AI</title></head>
<body>
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
  <p>New here?
    <a href="{% url 'signup' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Create an account</a>
  </p>
</body>
</html>
