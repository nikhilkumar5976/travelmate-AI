<!DOCTYPE html>
<html>
<head><title>Home - TravelMate AI</title></head>
<body>
  <h1>Welcome, {{ user.username }}!</h1>

  {% if profile.is_complete %}
    <p>Your profile is complete.</p>
  {% else %}
    <p>Your profile is incomplete. <a href="{% url 'edit_profile' %}">Complete it</a> to create or join trips.</p>
  {% endif %}

  <p><a href="{% url 'edit_profile' %}">Edit profile</a></p>

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
  </form>
</body>
</html>
